<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录 · LY</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/admin.css?v=mfa-v1"><script src="/login.js?v=mfa-v1" defer></script></head><body class="login-page">
<a class="login-back" href="/island/">← 返回公众展示</a><main class="login-layout"><section class="login-story"><span class="login-symbol">LY</span><p class="eyebrow">YOUR LITTLE WORLD</p><h1>自己的世界，<br>自己慢慢建。</h1><p>把今天的想法留成笔记，把做过的事情整理成项目。<br>登录后，都在同一个地方管理。</p><div class="login-sketch" aria-hidden="true">⌂<span>✦</span></div></section><section class="login-card"><p class="eyebrow">WELCOME BACK</p><h2>管理员登录</h2><p class="login-note">登录后进入你的管理平台。</p><form id="login-form"><label>账号<input id="login-username" name="username" autocomplete="username" maxlength="100" required placeholder="管理员账号" autofocus></label><label>密码<div class="password-field"><input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="200" required placeholder="输入你的密码"><button id="password-toggle" type="button" aria-label="显示密码">显示</button></div></label><label id="login-mfa-label" hidden>验证码或恢复码<input id="login-mfa-code" autocomplete="one-time-code" maxlength="40" placeholder="验证器中的 6 位数字，或一个恢复码"></label><button id="login-submit" type="submit" class="primary">登录管理平台 →</button><p id="login-status" class="form-status" role="status"></p></form><p class="login-footnote">使用原写作账号。公众阅读无需登录。</p></section></main></body></html>
