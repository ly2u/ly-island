name: ssg-compare

on:
  pull_request:
    branches: [framework]
    paths:
      - 'spikes/ssg-compare/**'
      - 'packages/protocol/**'
      - 'tools/xml/**'
      - '.github/workflows/ssg-compare.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    name: build and measure Astro and Eleventy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: check the XML checker against expat
        run: python3 tools/xml/xml-oracle.py 20000
      - run: node spikes/ssg-compare/measure.mjs
      - name: post the report on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('spikes/ssg-compare/report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file spikes/ssg-compare/report.md
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ssg-compare
          path: |
            spikes/ssg-compare/results.json
            spikes/ssg-compare/astro/dist
            spikes/ssg-compare/eleventy/dist
          if-no-files-found: warn
