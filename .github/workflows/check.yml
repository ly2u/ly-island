name: check

on:
  push:
    branches: [framework]
  pull_request:
    branches: [framework]

permissions:
  contents: read

jobs:
  protocol:
    name: protocol core (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  schemas:
    name: schemas and second implementation (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r packages/protocol/scripts/requirements.txt
      - run: python packages/protocol/scripts/check_schemas.py

  docs:
    name: documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py

  site:
    name: site (build both themes, check the output)
    runs-on: ubuntu-latest
    env:
      # CI builds the example island at https://example.org with the public test key.
      ISLAND_ALLOW_TEST_KEY: '1'
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r packages/protocol/scripts/requirements.txt
      - name: install
        working-directory: site
        run: node ../tools/run-annotated.mjs install -- npm ci --no-audit --no-fund
      - name: build twice
        working-directory: site
        run: |
          node ../tools/run-annotated.mjs build -- npm run build
          mv dist dist-first
          node ../tools/run-annotated.mjs rebuild -- npm run build
      - name: raw record loader (real failing and successful Astro builds in a disposable copy)
        working-directory: site
        run: node scripts/check-record-loader.mjs
      - name: check the isometric build
        run: node tools/site-check/cli.mjs site/dist --compare site/dist-first --theme isometric
      - name: check the built documents with the Python implementation
        run: python packages/protocol/scripts/check_schemas.py --documents site/dist
      - name: island service in workerd (wrangler dev, local D1)
        working-directory: site
        run: node ../tools/run-annotated.mjs smoke-worker -- npm run smoke:worker
      - name: island service on a real local D1 (limits, transactions, concurrency)
        working-directory: site
        run: node ../tools/run-annotated.mjs d1-check -- npm run d1:check
      - name: build and check the text theme
        working-directory: site
        env:
          ISLAND_THEME: text
        run: |
          rm -rf dist-first && mv dist dist-isometric
          node ../tools/run-annotated.mjs build-text -- npm run build
          node ../tools/site-check/cli.mjs dist --theme text
      - name: open both builds in a browser (phone width, with and without JavaScript, under the CSP)
        run: |
          python -m pip install -r tools/browser-check/requirements.txt
          python -m playwright install --with-deps chromium
          python tools/browser-check/check.py site/dist-isometric --theme isometric
          python tools/browser-check/check.py site/dist --theme text
          python tools/browser-check/check_budget_regressions.py site/dist-isometric
      - name: second test island (another settings file, English, text theme)
        working-directory: site
        env:
          ISLAND_CONFIG: examples/second-island.config.json
          # The public test key only signs https://example.org.
          ISLAND_ORIGIN: https://example.org
        run: |
          mv dist dist-text
          node ../tools/run-annotated.mjs build-second -- npm run build
          node ../tools/site-check/cli.mjs dist --theme text
          python ../tools/browser-check/check.py dist --theme text
          grep -q '<html lang="en"' dist/island/admin/index.html
      - name: owner tools
        working-directory: site
        run: |
          npm run keygen | grep -q '^ISLAND_SIGNING_KEY=[0-9a-f]\{64\}$'
          node ../tools/run-annotated.mjs unlocks -- npm run unlocks:save
          git diff --exit-code -- island/unlocks.json
      - name: wrangler configuration (dry run)
        working-directory: site
        run: |
          node scripts/wrangler-config.mjs
          node ../tools/run-annotated.mjs wrangler -- npx wrangler deploy --dry-run --config wrangler.generated.json --outdir ../.wrangler-dry-run
