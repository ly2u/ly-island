# Keeps site/package-lock.json in step with site/package.json on working
# branches. The authoring environment cannot reach the npm registry, so the
# lockfile is resolved here and committed back to the same branch.
# Runs only on pushes to claude/** branches of this repository; it never
# touches framework or main, and runs no install scripts.

name: lockfile

on:
  push:
    branches: ['claude/**']
    paths:
      - 'site/package.json'
      - '.github/workflows/lockfile.yml'

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: resolve site/package-lock.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: resolve
        working-directory: site
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: commit when changed
        run: |
          if git diff --quiet -- site/package-lock.json && git ls-files --error-unmatch site/package-lock.json >/dev/null 2>&1; then
            echo "lockfile is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/package-lock.json
          git commit -m "Resolve site/package-lock.json (npm $(npm --version), Node $(node --version))"
          git push origin HEAD:${GITHUB_REF_NAME}
